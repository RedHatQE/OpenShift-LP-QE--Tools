name: Build and Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/prow-analyzer/**'
      - 'image/container/prow-analyzer/**'
      - '.github/workflows/prow-analyzer--build.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/prow-analyzer/**'
      - 'image/container/prow-analyzer/**'
      - '.github/workflows/prow-analyzer--build.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
      with:
        go-version: '1.22'
    
    - name: Build CLI
      working-directory: ./apps/prow-analyzer
      run: go build -v ./cmd/prow-analyzer--cli

    - name: Build Bot
      working-directory: ./apps/prow-analyzer
      run: go build -v ./cmd/prow-analyzer--bot

    - name: Unit Tests with Coverage
      working-directory: ./apps/prow-analyzer
      run: |
        ( set -euxo pipefail; shopt -s inherit_errexit
            # Unit tests only: deterministic, all external dependencies mocked, no
            # goroutines. covermode=set makes coverage reproducible for the gate.
            go test -v -tags unit -coverprofile=coverage.out -covermode=set ./pkg/...
            go tool cover -func=coverage.out
        true )

    - name: Check Coverage Threshold
      working-directory: ./apps/prow-analyzer
      run: |
        ( set -euxo pipefail; shopt -s inherit_errexit
            typeset coverage
            coverage=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $3}' | sed 's/%//')
            typeset -r threshold=100.0
            if (( $(echo "${coverage} < ${threshold}" | bc -l) )); then
                echo "❌ Coverage ${coverage}% below threshold ${threshold}%"
                exit 1
            fi
            echo "✅ Coverage ${coverage}% meets threshold ${threshold}%"
        true )

    - name: Integration Tests
      working-directory: ./apps/prow-analyzer
      run: |
        ( set -euxo pipefail; shopt -s inherit_errexit
            # Integration tests: real HTTP servers and the async Handle() path,
            # run under the race detector. No coverage threshold is enforced here.
            go test -v -tags integration -race ./pkg/...
        true )

  container--build-and-push:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: images.paas.redhat.com
        username: ${{ secrets.QUAY____RHT__ITUP____IENG__APP__PROW_ANALYZER____USR }}
        password: ${{ secrets.QUAY____RHT__ITUP____IENG__APP__PROW_ANALYZER____PWD }}

    - name: Build and Push Container Image
      uses: docker/build-push-action@v6
      with:
        context: apps/prow-analyzer
        file: image/container/prow-analyzer/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: images.paas.redhat.com/ieng/app/prow-analyzer:latest
